<!DOCTYPE html>
<html>

<head>
    <title>Srimathi Mart - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>🛒 Srimathi Mart</h1>

        <p>Welcome Back!</p>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email">

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password">

        <button onclick="login()">
            LOGIN
        </button>

        <p>
            New user?
            <a href="register.html">Register</a>
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
